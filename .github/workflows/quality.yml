name: DemandLab quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Block known high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run build:pages
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ci.invalid' }}
      - name: Verify preview indexing policy
        run: npm run build && node scripts/verify-release.mjs && node scripts/verify-seo.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ci.invalid' }}
          DEPLOY_CONTEXT: preview
