<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">A daily order-control loop</title><desc id="desc">Record the order, choose one status, set a deadline and owner, then review the next action.</desc><rect width="960" height="300" rx="24" fill="#111b2b"/><g font-family="Segoe UI,Arial,sans-serif"><g fill="#1b2a40" stroke="#405779"><rect x="30" y="60" width="205" height="180" rx="18"/><rect x="273" y="60" width="205" height="180" rx="18"/><rect x="516" y="60" width="205" height="180" rx="18"/><rect x="759" y="60" width="171" height="180" rx="18"/></g><g fill="#80cfc4" font-size="14" font-weight="700"><text x="50" y="94">RECORD</text><text x="293" y="94">STATUS</text><text x="536" y="94">DEADLINE + OWNER</text><text x="779" y="94">DAILY</text></g><g fill="#f3f6fc" font-size="20" font-weight="700"><text x="50" y="132">ID · date</text><text x="293" y="132">One stage</text><text x="536" y="132">Next action</text><text x="779" y="132">Review</text></g><g fill="#bbc8d9" font-size="15"><text x="50" y="167"><tspan x="50">One row per order</tspan><tspan x="50" dy="21">or a distinct item</tspan><tspan x="50" dy="21">identifier</tspan></text><text x="293" y="167"><tspan x="293">Use an agreed</tspan><tspan x="293" dy="21">list without</tspan><tspan x="293" dy="21">near-duplicates</tspan></text><text x="536" y="167"><tspan x="536">When to dispatch</tspan><tspan x="536" dy="21">and who owns</tspan><tspan x="536" dy="21">the next step</tspan></text><text x="779" y="167"><tspan x="779">Find overdue work</tspan><tspan x="779" dy="21">and assign an</tspan><tspan x="779" dy="21">action</tspan></text></g><g fill="#80cfc4" font-size="25" font-weight="700"><text x="241" y="159">›</text><text x="484" y="159">›</text><text x="727" y="159">›</text></g></g></svg>
