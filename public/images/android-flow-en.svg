<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">A practical Android permission review</title><desc id="desc">Open a specific app's permissions, choose the least access needed and test the feature.</desc><rect width="960" height="300" rx="24" fill="#111b2b"/><g font-family="Segoe UI,Arial,sans-serif"><g fill="#192a3e" stroke="#405779"><rect x="42" y="50" width="270" height="200" rx="20"/><rect x="345" y="50" width="270" height="200" rx="20"/><rect x="648" y="50" width="270" height="200" rx="20"/></g><g fill="#80cfc4" font-size="15" font-weight="700"><text x="66" y="86">CHECK ONE PERMISSION</text><text x="369" y="86">CHOOSE NEEDED ACCESS</text><text x="672" y="86">TEST THE RESULT</text></g><g fill="#f3f6fc" font-size="20" font-weight="700"><text x="66" y="129">Select an app</text><text x="369" y="129">Use the least needed</text><text x="672" y="129">Does it work?</text></g><g fill="#bbc8d9" font-size="16"><text x="66" y="165"><tspan x="66">Settings → Apps → app</tspan><tspan x="66" dy="23">name → Permissions</tspan></text><text x="369" y="165"><tspan x="369">For example: while in use,</tspan><tspan x="369" dy="23">ask every time, or</tspan><tspan x="369" dy="23">don't allow</tspan></text><text x="672" y="165"><tspan x="672">Test the feature you need.</tspan><tspan x="672" dy="23">If necessary, change only</tspan><tspan x="672" dy="23">that permission</tspan></text></g><g fill="#80cfc4" font-size="25" font-weight="700"><text x="319" y="157">›</text><text x="622" y="157">›</text></g><text x="480" y="281" fill="#9eacc0" font-size="13" text-anchor="middle">Menu names and available options vary by Android version and phone maker</text></g></svg>
