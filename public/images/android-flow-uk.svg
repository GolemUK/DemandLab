<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Послідовність перевірки дозволу Android</title><desc id="desc">Відкрийте дозволи конкретної програми, оберіть найменший потрібний рівень і перевірте функцію.</desc><rect width="960" height="300" rx="24" fill="#111b2b"/><g font-family="Segoe UI,Arial,sans-serif"><g fill="#192a3e" stroke="#405779"><rect x="42" y="50" width="270" height="200" rx="20"/><rect x="345" y="50" width="270" height="200" rx="20"/><rect x="648" y="50" width="270" height="200" rx="20"/></g><g fill="#80cfc4" font-size="15" font-weight="700"><text x="66" y="86">ПЕРЕВІРТЕ ОДИН ДОЗВІЛ</text><text x="369" y="86">ОБЕРІТЬ ПОТРІБНИЙ ДОСТУП</text><text x="672" y="86">ПЕРЕВІРТЕ РЕЗУЛЬТАТ</text></g><g fill="#f3f6fc" font-size="20" font-weight="700"><text x="66" y="129">Застосунок</text><text x="369" y="129">Мінімально потрібний</text><text x="672" y="129">Функція працює?</text></g><g fill="#bbc8d9" font-size="16"><text x="66" y="165"><tspan x="66">Налаштування → Програми</tspan><tspan x="66" dy="23">→ назва → Дозволи</tspan></text><text x="369" y="165"><tspan x="369">Наприклад: лише під час</tspan><tspan x="369" dy="23">використання, запит щоразу</tspan><tspan x="369" dy="23">або заборона</tspan></text><text x="672" y="165"><tspan x="672">Перевірте потрібну дію.</tspan><tspan x="672" dy="23">За потреби змініть лише</tspan><tspan x="672" dy="23">цей дозвіл</tspan></text></g><g fill="#80cfc4" font-size="25" font-weight="700"><text x="319" y="157">›</text><text x="622" y="157">›</text></g><text x="480" y="281" fill="#9eacc0" font-size="13" text-anchor="middle">Назви меню й доступні варіанти залежать від версії Android і виробника телефона</text></g></svg>
