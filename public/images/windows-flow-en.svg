<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">A safer Windows cleanup sequence</title><desc id="desc">Confirm the drive, locate the storage category, review each item and recheck free space.</desc><rect width="960" height="300" rx="24" fill="#111b2b"/><g font-family="Segoe UI,Arial,sans-serif"><g fill="#1d2b42" stroke="#405779"><rect x="28" y="62" width="202" height="176" rx="18"/><rect x="272" y="62" width="202" height="176" rx="18"/><rect x="516" y="62" width="202" height="176" rx="18"/><rect x="760" y="62" width="172" height="176" rx="18"/></g><g fill="#80cfc4" font-size="15" font-weight="700"><text x="48" y="97">STEP 01</text><text x="292" y="97">STEP 02</text><text x="536" y="97">STEP 03</text><text x="780" y="97">STEP 04</text></g><g fill="#f3f6fc" font-size="19" font-weight="700"><text x="48" y="133">Confirm drive C:</text><text x="292" y="133">Review Storage</text><text x="536" y="133">Inspect each item</text><text x="780" y="133">Check again</text></g><g fill="#b8c5d7" font-size="15"><text x="48" y="165"><tspan x="48">This PC → available</tspan><tspan x="48" dy="21">space on the system</tspan><tspan x="48" dy="21">volume</tspan></text><text x="292" y="165"><tspan x="292">Settings → System →</tspan><tspan x="292" dy="21">Storage and cleanup</tspan><tspan x="292" dy="21">recommendations</tspan></text><text x="536" y="165"><tspan x="536">Recycle Bin, Downloads</tspan><tspan x="536" dy="21">and synced files need</tspan><tspan x="536" dy="21">special care</tspan></text><text x="780" y="165"><tspan x="780">After a small</tspan><tspan x="780" dy="21">cleanup, measure</tspan><tspan x="780" dy="21">free space again</tspan></text></g><g fill="#80cfc4" font-size="24" font-weight="700"><text x="238" y="159">›</text><text x="482" y="159">›</text><text x="726" y="159">›</text></g></g></svg>
