<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Безпечна послідовність очищення Windows</title><desc id="desc">Перевірте диск, знайдіть категорію, перегляньте кожен пункт і повторно виміряйте вільне місце.</desc><rect width="960" height="300" rx="24" fill="#111b2b"/><g font-family="Segoe UI,Arial,sans-serif"><g fill="#1d2b42" stroke="#405779"><rect x="28" y="62" width="202" height="176" rx="18"/><rect x="272" y="62" width="202" height="176" rx="18"/><rect x="516" y="62" width="202" height="176" rx="18"/><rect x="760" y="62" width="172" height="176" rx="18"/></g><g fill="#80cfc4" font-size="15" font-weight="700"><text x="48" y="97">КРОК 01</text><text x="292" y="97">КРОК 02</text><text x="536" y="97">КРОК 03</text><text x="780" y="97">КРОК 04</text></g><g fill="#f3f6fc" font-size="19" font-weight="700"><text x="48" y="133">Знайдіть диск C:</text><text x="292" y="133">Перевірте Storage</text><text x="536" y="133">Перегляньте пункти</text><text x="780" y="133">Звірте результат</text></g><g fill="#b8c5d7" font-size="15"><text x="48" y="165"><tspan x="48">Цей ПК → вільне</tspan><tspan x="48" dy="21">місце на системному</tspan><tspan x="48" dy="21">розділі</tspan></text><text x="292" y="165"><tspan x="292">Налаштування →</tspan><tspan x="292" dy="21">Система → Сховище</tspan><tspan x="292" dy="21">і рекомендації</tspan></text><text x="536" y="165"><tspan x="536">Кошик, Завантаження</tspan><tspan x="536" dy="21">і синхронізовані</tspan><tspan x="536" dy="21">файли потребують уваги</tspan></text><text x="780" y="165"><tspan x="780">Після малого</tspan><tspan x="780" dy="21">очищення</tspan><tspan x="780" dy="21">перевірте знову</tspan></text></g><g fill="#80cfc4" font-size="24" font-weight="700"><text x="238" y="159">›</text><text x="482" y="159">›</text><text x="726" y="159">›</text></g></g></svg>
